name: Build NexusPulse APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NexusPulse repo
        uses: actions/checkout@v4

      - name: Checkout Telegram-FOSS
        run: |
          git clone --depth=1 https://github.com/Telegram-FOSS-Team/Telegram-FOSS.git source
          cd source
          git submodule update --init --recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Python + Pillow
        run: |
          python3 -m pip install --upgrade pip
          pip install pillow

      - name: Apply NexusPulse mod (rebrand + ghost mode)
        env:
          NEXUS_APP_ID: ${{ secrets.APP_ID }}
          NEXUS_APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          python3 $GITHUB_WORKSPACE/scripts/apply_mod.py
        working-directory: source

      - name: Build native dependencies (libvpx, ffmpeg, boringssl)
        working-directory: source/TMessagesProj/jni
        run: |
          (which ninja || sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build yasm nasm) >/dev/null
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "ndk;21.4.7075529" >/dev/null
          NDK_DIR=${ANDROID_HOME}/ndk/21.4.7075529
          echo "Using NDK: $NDK_DIR"
          export NDK=$NDK_DIR
          export NINJA_PATH=$(which ninja)
          ./build_libvpx_clang.sh
          ./build_ffmpeg_clang.sh
          ./patch_ffmpeg.sh
          ./patch_boringssl.sh
          ./build_boringssl.sh

      - name: Build APK (debug, signed with debug key)
        working-directory: source
        run: |
          export KEYSTORE_PASS=android
          export KEY_ALIAS=androiddebugkey
          export KEY_PASS=android
          ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          find source -name "*.apk" -path "*outputs*" -exec ls -la {} \;
          find source -name "*.apk" -path "*outputs*" -exec cp {} NexusPulse.apk \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusPulse-APK
          path: NexusPulse.apk

      - name: Release (auto-release on tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: NexusPulse.apk
